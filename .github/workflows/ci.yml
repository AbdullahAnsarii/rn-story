name: CI
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

      - name: Typecheck example app
        run: yarn --cwd example typecheck

  # The library only uses the part of expo-video's API that has been there
  # since SDK 52 (expo-video 2.0). Compiling against that oldest supported
  # release catches any accidental use of something newer.
  typecheck-oldest-expo-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install the oldest supported expo-video
        run: yarn add --dev --ignore-engines --no-lockfile expo-video@2.0.6 expo@52.0.49

      - name: Typecheck against it
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepack

      # The entry points package.json declares must exist exactly where it
      # says, and nothing may leak into the type output and nest it (a stray
      # directory in the build project once shifted everything under
      # lib/typescript/src/, which would have shipped broken types).
      - name: Verify build output layout
        run: |
          test -f lib/commonjs/index.js
          test -f lib/module/index.js
          test -f "$(node -p "require('./package.json').types")"
          test ! -e lib/typescript/src
          test ! -e lib/typescript/snack
          echo "build output layout OK"
